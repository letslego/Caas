[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-context-service"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
adk = ["google-adk>=1.16"]
dev = ["pytest>=8", "psycopg[binary]>=3.2", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caas = ["schema.sql"]

[project.scripts]
caas-api = "caas.cli:main"
caas-worker = "caas.worker:main"
